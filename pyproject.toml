[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroscience-ml1"
version = "0.1.0"
description = "Latent-Space Dynamics of Large-Scale Spike Trains & fMRI/iEEG Fusion via Cross-Attention Transformers and State-Space Models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vishwanath Barve" }
]
keywords = [
    "neuroscience",
    "deep-learning",
    "cross-attention-transformer",
    "state-space-models",
    "neuropixels",
    "fmri",
    "latent-dynamics",
    "domain-adaptation"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "scikit-learn>=1.2.0",
    "umap-learn>=0.5.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0"
]
data = [
    "pynwb>=2.5.0",
    "nilearn>=0.10.0"
]
notebooks = [
    "nbformat>=5.9.0",
    "nbconvert>=7.4.0",
    "jupyter>=1.0.0"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --durations=5"
testpaths = ["tests"]
pythonpath = ["."]
